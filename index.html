<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Have a Question... 🤔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .gif-container img {
            width: 150px;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #38b000;
            color: white;
            box-shadow: 0 4px 15px rgba(56, 176, 0, 0.3);
            z-index: 2;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #007200;
        }

        #noBtn {
            background-color: #ff4d6d;
            color: white;
            position: fixed;
            z-index: 10;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div class="gif-container">
            <img src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHExODVnd3VvYXF6YmszcmY0NWh5ZXJhcm1reHpxbms1M296b3A3byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/C0Asg9I511E5aaC5S8/giphy.gif" alt="Cute bear">
        </div>
        
        <h1>Salam Angel! 😂🤩👋</h1>
        <p>Will you make our time to see me this evening? 😊😂✨</p>

        <form id="loveForm" action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST" style="display: none;">
            <input type="text" name="Response" value="Angel said YES! 🎉">
        </form>

        <div class="btn-container">
            <button id="yesBtn" onclick="submitYes()">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        
        function initButtonPosition() {
            const yesRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (yesRect.right + 20) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        }
        
        window.addEventListener('DOMContentLoaded', initButtonPosition);
        window.addEventListener('resize', initButtonPosition);

        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distanceX = mouseX - btnCenterX;
            const distanceY = mouseY - btnCenterY;
            const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

            const sensitivityRadius = 100; 

            if (distance < sensitivityRadius) {
                const dirX = distance === 0 ? 1 : -distanceX / distance;
                const dirY = distance === 0 ? 1 : -distanceY / distance;

                const pushSpeed = 15; 
                
                let newX = btnRect.left + dirX * pushSpeed;
                let newY = btnRect.top + dirY * pushSpeed;

                const padding = 20; 
                const minX = padding;
                const minY = padding;
                const maxX = window.innerWidth - btnRect.width - padding;
                const maxY = window.innerHeight - btnRect.height - padding;

                if (newX < minX) newX = minX;
                if (newX > maxX) newX = maxX;
                if (newY < minY) newY = minY;
                if (newY > maxY) newY = maxY;

                noBtn.style.left = newX + 'px';
                noBtn.style.top = newY + 'px';
            }
        });

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            const padding = 40;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            noBtn.style.left = Math.max(padding, Math.floor(Math.random() * maxX)) + 'px';
            noBtn.style.top = Math.max(padding, Math.floor(Math.random() * maxY)) + 'px';
        });

        function submitYes() {
            const form = document.getElementById('loveForm');
            const container = document.getElementById('mainCard');
            
            // Submits the response smoothly to Formspree
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(() => {
                showSuccessPage(container);
            }).catch(() => {
                showSuccessPage(container);
            });
        }

        function showSuccessPage(container) {
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW95M3N6cXN6bXN6cXN6bXN6cXN6bXN6cXN6bXN6cXN6ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26vUxO3A8WVYqXwX6/giphy.gif" alt="Happy dance">
                </div>
                <h1>Yayyy! 🎉🥳</h1>
                <p>I knew you couldn't resist! See you this evening! ❤️</p>
            `;
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
